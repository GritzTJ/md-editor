# -----------------------------------------------------------------------------
# md-editor -- configuration nginx.
#
# Le serveur n'a qu'un seul role : livrer un fichier HTML statique et les
# en-tetes de securite qui vont avec. Il ne recoit jamais de contenu utilisateur,
# donc aucune methode d'ecriture n'est acceptee et aucun journal d'acces n'est
# tenu (rien a y ecrire qui ne soit deja evident, et rien a fuiter).
#
# ATTENTION : dans nginx, un `add_header` place dans un bloc `location` annule
# *tous* ceux herites du bloc `server`. Les en-tetes de securite sont donc
# declares une seule fois, ici, et aucun `add_header` n'apparait plus bas --
# sinon la page principale serait servie sans CSP.
# -----------------------------------------------------------------------------

server {
    # Ecoute IPv4 uniquement : `listen [::]:8080` fait echouer le demarrage sur
    # un hote dont le noyau n'a pas IPv6, ce qui est courant dans les runtimes
    # de conteneurs. La publication du port cote hote gere le double pile.
    listen       8080;
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;
    default_type text/plain;

    access_log off;

    # Interdit tout sauf la lecture : ni upload, ni methode exotique.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # La CSP est generee par build.mjs car elle contient le condensat SHA-256 du
    # script inline. En-tete HTTP *et* balise <meta> portent la meme politique :
    # l'en-tete ajoute `frame-ancestors`, que <meta> ignore, et la balise survit
    # au telechargement du fichier.
    include /etc/nginx/csp.conf;

    add_header X-Content-Type-Options       "nosniff"     always;
    add_header X-Frame-Options              "DENY"        always;
    add_header Referrer-Policy              "no-referrer" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy
        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), interest-cohort=()"
        always;

    # Le nom du fichier ne change pas d'une version a l'autre : on revalide a
    # chaque chargement pour qu'une mise a jour de l'image soit prise en compte
    # immediatement, et pour qu'un utilisateur puisse verifier le condensat de
    # ce qu'il recoit vraiment.
    add_header Cache-Control "no-cache" always;

    # text/html est toujours compresse par nginx et ne doit pas etre repete
    # dans gzip_types, sous peine d'avertissement au demarrage.
    gzip             on;
    gzip_types       text/plain;
    gzip_min_length  1024;

    # Sonde de sante : repond sans toucher au disque.
    location = /healthz {
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    # Publie le condensat du fichier livre, pour verification cote utilisateur.
    location = /index.html.sha256 { }

    location = /index.html { }

    location / {
        return 404;
    }
}
