# -----------------------------------------------------------------------------
# md-editor -- nginx configuration.
#
# The server has exactly one job: deliver a static HTML file and the security
# headers that go with it. It never receives user content, so no write method is
# accepted and no access log is kept (nothing to write there that is not already
# obvious, and nothing to leak).
#
# CAUTION: in nginx, an `add_header` placed inside a `location` block cancels
# *all* those inherited from the `server` block. The security headers are
# therefore declared once, here, and no `add_header` appears further down --
# otherwise the main page would be served with no CSP at all.
# -----------------------------------------------------------------------------

server {
    # IPv4 only: `listen [::]:8080` fails to start on a host whose kernel lacks
    # IPv6, which is common in container runtimes. Host-side port publishing
    # handles dual stack.
    listen       8080;
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;
    default_type text/plain;

    access_log off;

    # Read-only: no upload, no exotic method.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # The CSP is generated by build.mjs because it carries the SHA-256 digest of
    # the inline script. HTTP header *and* <meta> tag carry the same policy: the
    # header adds `frame-ancestors`, which <meta> ignores, and the tag survives
    # downloading the file.
    include /etc/nginx/csp.conf;

    add_header X-Content-Type-Options       "nosniff"     always;
    add_header X-Frame-Options              "DENY"        always;
    add_header Referrer-Policy              "no-referrer" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy
        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), interest-cohort=()"
        always;

    # The file name never changes between versions, so revalidate on every load:
    # an image update takes effect immediately, and a user can check the digest
    # of what they actually received.
    add_header Cache-Control "no-cache" always;

    # text/html is always compressed by nginx and must not be repeated in
    # gzip_types, or it warns at startup.
    gzip             on;
    gzip_types       text/plain;
    gzip_min_length  1024;

    # Health probe: answers without touching the disk.
    location = /healthz {
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    # Publishes the delivered file's digest, for user-side verification.
    location = /index.html.sha256 { }

    location = /index.html { }

    location / {
        return 404;
    }
}
