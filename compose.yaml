# Minimal deployment. The container stores nothing and needs no volume: a
# read-only filesystem is enough.
services:
  md-editor:
    image: ghcr.io/GritzTJ/md-editor:latest
    # To build locally instead of pulling the published image:
    # build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # nginx needs to write its temporary files and its PID.
      - /tmp:mode=1777,size=16m
      - /var/cache/nginx:mode=0700,uid=101,gid=101,size=16m
      - /var/run:mode=0755,uid=101,gid=101,size=1m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
