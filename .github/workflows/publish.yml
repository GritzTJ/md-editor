# -----------------------------------------------------------------------------
# Construction et publication de l'image sur le GitHub Container Registry.
#
# `${{ github.repository }}` designe le depot courant : le workflow publie donc
# sur ghcr.io/<owner>/<repo> sans nom en dur, quel que soit le compte qui
# heberge le projet ou le fork.
# -----------------------------------------------------------------------------

name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Les verifications tournent hors Docker pour donner un retour rapide et un
  # journal lisible ; le Dockerfile les rejoue de toute facon pendant le build,
  # afin qu'aucune image ne puisse etre produite sans elles.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node verify.mjs

      # Le condensat du fichier reellement livre : c'est la valeur qu'un
      # utilisateur peut comparer a ce que son navigateur a recu.
      - name: Publier le condensat du fichier livre
        run: |
          echo '### Fichier livre' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/index.html.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # puppeteer est installe ici seulement : l'ajouter aux devDependencies
      # imposerait le telechargement d'un Chrome complet a chaque `npm install`
      # et a chaque construction d'image.
      - name: Tests navigateur
        run: |
          set -euo pipefail
          npm install --no-save puppeteer
          node build.mjs --serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && break || sleep 1
          done
          node test/browser.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: md-editor-html
          path: |
            dist/index.html
            dist/index.html.sha256

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Sur une pull request on construit sans publier : l'image n'est validee
      # que si elle se construit, sans exposer le registre a du code non fusionne.
      - name: Authentification au registre
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Attestation de provenance : relie l'image publiee au depot, au commit et
      # au workflow qui l'ont produite. Verification :
      #   gh attestation verify oci://ghcr.io/OWNER/md-editor:latest --repo OWNER/md-editor
      - name: Attester la provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Verifie que l'image publiee sert bien la page et ses en-tetes de securite.
  smoke:
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Demarrer le conteneur et controler les en-tetes
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker run -d --name md-editor -p 8080:8080 "$IMAGE"
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz >/dev/null && break || sleep 1
          done

          headers=$(curl -sSI http://localhost:8080/)
          echo "$headers"

          for expected in \
            "content-security-policy" \
            "default-src 'none'" \
            "connect-src 'none'" \
            "frame-ancestors 'none'" \
            "x-content-type-options" \
            "referrer-policy"
          do
            echo "$headers" | tr 'A-Z' 'a-z' | grep -q "$expected" \
              || { echo "en-tete manquant : $expected"; exit 1; }
          done

          curl -sf http://localhost:8080/ | grep -q 'id="app-js"' \
            || { echo "la page ne contient pas l'application"; exit 1; }

          # Le condensat servi doit correspondre au fichier construit.
          served=$(curl -sf http://localhost:8080/ | sha256sum | cut -d' ' -f1)
          declared=$(curl -sf http://localhost:8080/index.html.sha256 | cut -d' ' -f1)
          [ "$served" = "$declared" ] \
            || { echo "condensat different : servi $served, annonce $declared"; exit 1; }

          echo "l'image publiee se comporte comme attendu"
