# -----------------------------------------------------------------------------
# Build and publish the image to the GitHub Container Registry.
#
# `${{ github.repository }}` is the current repository, so the workflow pushes
# to ghcr.io/<owner>/<repo> with no hard-coded name, whichever account hosts the
# project or the fork.
#
# Every action is pinned to a commit SHA rather than a tag. A tag is mutable:
# whoever controls the action's repository can repoint `v5` at new code, and
# that code runs here with our `packages: write` token and our attestation
# signing key. The trailing comment is the human-readable version at that SHA,
# and is what Dependabot rewrites when it proposes an upgrade.
# -----------------------------------------------------------------------------

name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Checks run outside Docker for fast feedback and a readable log; the
  # Dockerfile replays them during the build anyway, so no image can be produced
  # without them.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Deliberately blocking. Everything in `dependencies` is compiled into
      # the single file the user runs, so a known-vulnerable release is not a
      # backlog item here -- it is shipped code. To release anyway, bump the
      # threshold on this line in a commit that says why.
      - name: Audit the dependencies
        run: npm audit --audit-level=high

      - run: npm run build
      - run: node verify.mjs

      # Digest of the file actually delivered: the value a user can compare
      # against what their browser received.
      - name: Publish the delivered file digest
        run: |
          echo '### Delivered file' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/index.html.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # puppeteer is installed here only: adding it to devDependencies would
      # force a full Chrome download on every `npm install` and every image
      # build.
      - name: Browser tests
        run: |
          set -euo pipefail
          npm install --no-save puppeteer
          node build.mjs --serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && break || sleep 1
          done
          node test/browser.mjs
          node test/roundtrip.mjs
          node test/buttons.mjs
          node test/syntax.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: md-editor-html
          path: |
            dist/index.html
            dist/index.html.sha256

  # Blink, Gecko and WebKit, in one job. Network containment is enforced by the
  # browser, so a claim checked on one engine is a claim checked on one engine.
  # Separate from `verify` because it pulls three browsers and their system
  # libraries, and there is no reason to make the fast checks wait for that.
  crossbrowser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Install the engines
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox webkit

      - name: Run the cross-engine suite
        run: |
          set -euo pipefail
          node build.mjs --serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && break || sleep 1
          done
          node test/crossbrowser.mjs

  publish:
    needs: [verify, crossbrowser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # On a pull request the image is built but not pushed: it is validated
      # without exposing the registry to unmerged code.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: |
            COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Provenance attestation: ties the published image to the repository, the
      # commit and the workflow that produced it. Verify with:
      #   gh attestation verify oci://ghcr.io/OWNER/md-editor:latest --repo OWNER/md-editor
      - name: Attest provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Checks that the published image really serves the page and its security
  # headers.
  smoke:
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The package may inherit the repository's visibility, but not always, so
      # authenticate rather than depend on it.
      - name: Log in to the registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the container and check the headers
        run: |
          set -euo pipefail
          # A registry reference has to be lower case, and `github.repository`
          # keeps the owner's original casing. docker/metadata-action folds it
          # for the build; this step is hand-written and has to do it itself.
          IMAGE="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]'):sha-${GITHUB_SHA}"
          docker run -d --name md-editor -p 8080:8080 "$IMAGE"
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz >/dev/null && break || sleep 1
          done

          headers=$(curl -sSI http://localhost:8080/)
          echo "$headers"

          for expected in \
            "content-security-policy" \
            "default-src 'none'" \
            "connect-src 'none'" \
            "frame-ancestors 'none'" \
            "x-content-type-options" \
            "referrer-policy"
          do
            echo "$headers" | tr 'A-Z' 'a-z' | grep -q "$expected" \
              || { echo "missing header: $expected"; exit 1; }
          done

          # Fetched to a file rather than piped: `grep -q` stops at the first
          # match and closes the pipe, curl takes a SIGPIPE, and `pipefail`
          # turns that into a failed pipeline on a page that was served
          # perfectly. It also means the digest below covers exactly the bytes
          # that were just checked.
          curl -sf http://localhost:8080/ -o served.html

          grep -q 'id="app-js"' served.html \
            || { echo "the page does not contain the application"; exit 1; }

          served=$(sha256sum served.html | cut -d' ' -f1)
          declared=$(curl -sf http://localhost:8080/index.html.sha256 | cut -d' ' -f1)
          [ "$served" = "$declared" ] \
            || { echo "digest mismatch: served $served, announced $declared"; exit 1; }

          echo "the published image behaves as expected"
